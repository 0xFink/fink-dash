function b2a(b){return Uint8Array.from(atob(b),function(c){return c.charCodeAt(0)})}
function show(t){document.getElementById("m").textContent=t}
async function decrypt(pw){
 var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),{name:"PBKDF2"},false,["deriveKey"]);
 var k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b2a(S),iterations:IT,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
 return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b2a(IV)},k,b2a(D)));
}
// Swap the page in WITHOUT document.open(), so the wallet's listeners survive.
function mount(html){
 var doc=new DOMParser().parseFromString(html,"text/html");
 document.title=doc.title;
 var scripts=[];
 [["head",document.head],["body",document.body]].forEach(function(pair){
  var from=doc[pair[0]], to=pair[1];
  while(to.firstChild)to.removeChild(to.firstChild);
  Array.prototype.slice.call(from.childNodes).forEach(function(n){
   if(n.nodeName==="SCRIPT"){scripts.push(n);return;}
   to.appendChild(document.importNode(n,true));
  });
 });
 Array.prototype.forEach.call(doc.body.attributes,function(a){document.body.setAttribute(a.name,a.value)});
 scripts.forEach(function(old){
  var s=document.createElement("script");
  Array.prototype.forEach.call(old.attributes,function(a){s.setAttribute(a.name,a.value)});
  s.textContent=old.textContent;
  document.body.appendChild(s);
 });
}
async function tryPw(pw,remember){
 show("unlocking\u2026");
 var html;
 try{ html=await decrypt(pw); }catch(e){ show("wrong password"); document.getElementById("p").value=""; try{sessionStorage.removeItem("pk")}catch(x){} return; }
 if(remember) try{sessionStorage.setItem("pk",pw)}catch(e){}
 mount(html);
