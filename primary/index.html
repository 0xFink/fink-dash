<html lang="en"><head><script>/* ui-accel */(function(CFG){
    if(window.__accel){ if(CFG.gated) window.__gated=true; return; }
    window.__accel=1; if(CFG.gated) window.__gated=true;
    var G=4000, READAHEAD=6, LIVE_MS=20000;
    var of=window.fetch.bind(window);
    function resp(obj,status){ status=status||200;
      return {ok:status<300,status:status,headers:{get:function(){return 'application/json'}},
        json:function(){return Promise.resolve(obj)},text:function(){return Promise.resolve(JSON.stringify(obj))},clone:function(){return resp(obj,status)}}; }
    function hex(n){ return '0x'+n.toString(16); }
    function rpc(m,p){ return of(CFG.rpc,{method:'POST',headers:{'content-type':'application/json'},
        body:JSON.stringify({jsonrpc:'2.0',id:1,method:m,params:p})})
      .then(function(r){ if(!r.ok) throw new Error('http '+r.status); return r.json(); })
      .then(function(j){ if(j.error) throw new Error(j.error.message); return j.result; }); }

    var bn=null, bnT=0;
    function blockNumber(){ if(bn&&Date.now()-bnT<3000) return bn; bnT=Date.now();
      bn=rpc('eth_blockNumber',[]).then(function(h){ return parseInt(h,16); },function(e){ bn=null; throw e; }); return bn; }
    var blocks={};

    var caches={}; // filter key -> {chunks:{idx:{p,logs,t,full}}}
    function chunk(key,filter,i,latest){
      var c=caches[key]||(caches[key]={chunks:{}}), e=c.chunks[i];
      var top=(i+1)*G-1>=latest;
      if(e&&(e.full||Date.now()-e.t<LIVE_MS)) return e.p;
      var from=i*G, to=Math.min((i+1)*G-1,latest);
      var ent={t:Date.now(),full:!top};
      ent.p=rpc('eth_getLogs',[{address:filter.address,topics:filter.topics,fromBlock:hex(from),toBlock:hex(to)}])
        .then(function(l){ return l; },function(err){ delete c.chunks[i]; throw err; });
      c.chunks[i]=ent; return ent.p;
    }
    function getLogs(filter,from,to){
      var key=JSON.stringify([String(filter.address).toLowerCase(),filter.topics]);
      return blockNumber().then(function(latest){
        if(to>latest) to=latest;
        var a=Math.floor(from/G), b=Math.floor(to/G), need=[];
        for(var i=a;i<=b;i++) need.push(chunk(key,filter,i,latest));
        for(var k=1;k<=READAHEAD;k++) if(a-k>=0) chunk(key,filter,a-k,latest).catch(function(){});
        return Promise.all(need).then(function(parts){
          var out=[];
          parts.forEach(function(l){ l.forEach(function(x){ var n=parseInt(x.blockNumber,16); if(n>=from&&n<=to) out.push(x); }); });
          out.sort(function(x,y){ return parseInt(x.blockNumber,16)-parseInt(y.blockNumber,16)||parseInt(x.logIndex,16)-parseInt(y.logIndex,16); });
          return out;
        });
      });
    }

    window.fetch=function(url,init){
      try{
        var u=typeof url==='string'?url:(url&&url.url)||'';
        if(window.__gated&&/\/lp-config\.json(\?|$)/.test(u)) return Promise.resolve(resp({},404));
        if(u===CFG.rpc&&init&&typeof init.body==='string'&&init.body.charAt(0)==='{'){
          var b=JSON.parse(init.body), done=function(r){ return resp({jsonrpc:'2.0',id:b.id,result:r}); };
          if(b.method==='eth_blockNumber') return blockNumber().then(function(n){ return done(hex(n)); }).catch(function(){ return of(url,init); });
          if(b.method==='eth_getBlockByNumber'&&/^0x[0-9a-f]+$/i.test(b.params[0])&&!b.params[1]){
            var bk=b.params[0].toLowerCase();
            if(!blocks[bk]) blocks[bk]=rpc('eth_getBlockByNumber',[bk,false]).catch(function(e){ delete blocks[bk]; throw e; });
            return blocks[bk].then(done).catch(function(){ return of(url,init); });
          }
          if(b.method==='eth_getLogs'){
            var f=b.params[0], fr=parseInt(f.fromBlock,16), to=parseInt(f.toBlock,16);
            if(f.address&&f.topics&&isFinite(fr)&&isFinite(to)&&to-fr<=2*G)
              return getLogs(f,fr,to).then(done).catch(function(){ return of(url,init); });
          }
        }
      }catch(e){}
      return of(url,init);
    };

    // PBKDF2 memo
    try{
      var S=crypto.subtle, oImp=S.importKey.bind(S), oDer=S.deriveKey.bind(S), oBits=S.deriveBits.bind(S), pw=new WeakMap();
      var b64=function(buf){ var s='',a=new Uint8Array(buf); for(var i=0;i<a.length;i++) s+=String.fromCharCode(a[i]); return btoa(s); };
      var unb64=function(s){ return Uint8Array.from(atob(s),function(c){ return c.charCodeAt(0); }); };
      var bytes=function(d){ return d instanceof ArrayBuffer?new Uint8Array(d):new Uint8Array(d.buffer,d.byteOffset,d.byteLength); };
      S.importKey=function(fmt,data,alg,ext,uses){
        var name=alg&&(alg.name||alg);
        if(fmt==='raw'&&name==='PBKDF2'){
          var raw=bytes(data).slice();
          return oImp(fmt,raw,alg,false,['deriveKey','deriveBits']).then(function(k){ pw.set(k,raw); return k; });
        }
        return oImp(fmt,data,alg,ext,uses);
      };
      S.deriveKey=function(alg,base,dAlg,ext,uses){
        if(!(alg&&alg.name==='PBKDF2'&&pw.has(base))) return oDer(alg,base,dAlg,ext,uses);
        var p=pw.get(base), s=bytes(alg.salt), meta=new TextEncoder().encode('|'+alg.iterations+'|'+(alg.hash.name||alg.hash)+'|'+(dAlg.length||256)+'|');
        var all=new Uint8Array(p.length+s.length+meta.length); all.set(p,0); all.set(s,p.length); all.set(meta,p.length+s.length);
        return S.digest('SHA-256',all).then(function(h){
          var id='accel.k.'+b64(h), hit=null; try{ hit=sessionStorage.getItem(id); }catch(e){}
          var bitsP=hit?Promise.resolve(unb64(hit)):oBits(alg,base,dAlg.length||256).then(function(bits){ try{ sessionStorage.setItem(id,b64(bits)); }catch(e){} return new Uint8Array(bits); });
          return bitsP.then(function(bits){ return oImp('raw',bits,dAlg,ext,uses); });
        });
      };
    }catch(e){}
  })({"rpc":"https://rpc.mainnet.chain.robinhood.com","gated":true});</script><meta charset="utf-8">

async function keyFrom(pw){

 return crypto.subtle.deriveKey({name:"PBKDF2",salt:b2a(S),iterations:IT,hash:"SHA-256"},
   km,{name:"AES-GCM",length:256},true,["decrypt"]);
}
async function openWith(key){
 var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b2a(IV)},key,b2a(D));
 var html=new TextDecoder().decode(pt);
 // full re-parse so inline scripts actually run
 document.open(); document.write(html); document.close();
}
async function tryPw(pw,remember){
 show("unlocking\u2026");
 try{
  var key=await keyFrom(pw);
  await openWith(key);
  if(remember) try{sessionStorage.setItem("sk",pw)}catch(e){}
 }catch(e){ show("wrong password"); document.getElementById("p").value=""; }
}
document.getElementById("go").onclick=function(){tryPw(document.getElementById("p").value,true)};
document.getElementById("p").addEventListener("keydown",function(e){if(e.key==="Enter")tryPw(e.target.value,true)});
// already unlocked this session? go straight in
(function(){var pw=null;try{pw=sessionStorage.getItem("sk")}catch(e){}
 if(pw) tryPw(pw,false);})();
})();
</script></body></html>
